<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reconcile Automation</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 touch-manipulation">
    <div class="min-h-screen flex justify-center items-center">
        <div class="text-center space-y-6">
            <div id="number" class="text-5xl font-bold">0</div>

            <div class="space-x-4">
                <button class="p-2 w-12 rounded-lg bg-red-600 text-white cursor-pointer text-2xl" onclick="addCount(1)">1</button>
                <button class="p-2 w-12 rounded-lg bg-blue-600 text-white cursor-pointer text-2xl" onclick="addCount(2)">2</button>
                <button class="p-2 w-12 rounded-lg bg-green-600 text-white cursor-pointer text-2xl" onclick="addCount(3)">3</button>
                <button class="p-2 w-12 rounded-lg bg-yellow-600 text-white cursor-pointer text-2xl" onclick="addCount(4)">4</button>
            </div>

            <div class="flex justify-between gap-4">
                <button class="text-white bg-black p-2 rounded-lg w-full cursor-pointer" onclick="resetCount()">Reset</button>
                <button class="text-white bg-black p-2 rounded-lg w-full cursor-pointer" onclick="backCount()">Back</button>
            </div>
        </div>
    </div>
    
    <script>

        let count = 0;
        let history = [];

        let displayNumber = document.getElementById('number');

        function addCount(value) {
            count += value;
            history.push(value);
            displayNumber.textContent = count;
        }

        function resetCount() {
            count = 0;
            history = [];
            displayNumber.textContent = count;
        }

        function backCount() {
            if (history.length > 0) {
                let popValue = history.pop();
                count = count - popValue;
                displayNumber.textContent = count;
            }
        }

    </script>
</body>
</html>
